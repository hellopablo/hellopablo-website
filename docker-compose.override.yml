services:
    webserver:
        links:
            - mail
        environment:
            - OPCACHE_VALIDATE_TIMESTAMPS=1

    mail:
        build: "docker/mail"
        ports:
            - "1025:1025"
            - "8025:8025"

    db:
        environment:
            - MYSQL_USER=docker
            - MYSQL_PASSWORD=docker
            - MYSQL_DATABASE=dev
